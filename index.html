<style>
    /* Import Figtree font */
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap');

    .generator-container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: 'Figtree', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #414042;
    }
    .generator-container h3 {
        color: #414042;
        margin-top: 0;
        margin-bottom: 5px;
    }
    .generator-container .last-updated {
        font-size: 0.85em;
        color: #006C91;
        background-color: #e6f4f8;
        padding: 4px 8px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 15px;
        border: 1px solid #bfe0eb;
        font-weight: 600;
    }
    .generator-container .subtitle {
        font-size: 0.9em;
        color: #666;
        margin-bottom: 15px;
    }
    .generator-container label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }
    .generator-container input[type="text"],
    .generator-container textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: inherit;
        color: inherit;
    }
    
    /* Media Toggle Styles */
    .generator-container .radio-group {
        display: flex;
        gap: 20px;
        margin: 15px 0;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #eef0f2;
    }
    .generator-container .radio-option {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-weight: normal;
        margin-top: 0;
    }
    .generator-container .radio-option input {
        cursor: pointer;
        margin: 0;
    }

    .generator-container .button-group {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        margin-bottom: 20px;
    }
    .generator-container button {
        background-color: #009ABC;
        color: white;
        padding: 12px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
        font-family: inherit;
        transition: background-color 0.2s ease;
        flex-grow: 1;
        margin-top: 0;
    }
    .generator-container button:hover {
        background-color: #006C91;
    }
    
    #resetButton {
        background-color: #A9A9A9;
    }
    #resetButton:hover {
        background-color: #808080;
    }

    #outputCode {
        background-color: #f4f4f4;
        border: 1px solid #ddd;
        padding: 15px;
        margin-top: 5px;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 50px;
        font-family: monospace;
        color: #333;
    }
    #copyButton {
        padding: 10px 12px;
        font-size: 0.95em;
        margin-top: 10px;
        background-color: #009ABC; 
        transition: background-color 0.2s ease;
        display: block;
        width: 100%;
        box-sizing: border-box;
    }
    #copyButton:hover {
        background-color: #006C91;
    }
    .error-text {
        color: #d9534f;
        font-weight: bold;
    }
</style>

<div class="generator-container">
    <h3>Canvas video embed code generator</h3>
    <div class="last-updated">Last updated: 23 Oct 2026 by Hollie Herne</div>
    <div class="subtitle">Generate Rich Content Editor (RCE) sanitizer-proof layouts from raw YouTube URLs or EchoVideo platform embed snippets.</div>

    <label>Select media source type:</label>
    <div class="radio-group">
        <label class="radio-option">
            <input type="radio" name="mediaType" value="echo" checked onchange="toggleMediaType()"> Echo360 LTI asset
        </label>
        <label class="radio-option">
            <input type="radio" name="mediaType" value="youtube" onchange="toggleMediaType()"> YouTube Video
        </label>
    </div>

    <label for="videoTitle">Video title:</label>
    <input type="text" id="videoTitle" placeholder="e.g., AI changing use in society">

    <label for="source">Source (or channel for YouTube):</label>
    <input type="text" id="source" value="UC">

    <label for="year">Year:</label>
    <input type="text" id="year" value="2027">

    <label id="inputCodeLabel" for="embedCode">Echo LTI iframe code (paste full code snippet including the iframe tags):</label>
    <textarea id="embedCode" rows="4" placeholder=""></textarea>

    <div class="button-group">
        <button onclick="generateCode()">Generate HTML code</button>
        <button id="resetButton" onclick="resetGenerator()">Reset generator</button>
    </div>

    <label for="outputCode">Generated code (copy and paste into the Canvas HTML editor):</label>
    <div id="outputCode"></div>
    
    <button id="copyButton" onclick="copyCode()" style="display: none;">Copy code to clipboard</button>
</div>

<script>
    function toggleMediaType() {
        const selectedType = document.querySelector('input[name="mediaType"]:checked').value;
        const label = document.getElementById('inputCodeLabel');
        const titleInput = document.getElementById('videoTitle');
        const sourceInput = document.getElementById('source');
        const yearInput = document.getElementById('year');
        const embedInput = document.getElementById('embedCode');
        
        if (selectedType === 'echo') {
            label.textContent = "Echo LTI iframe code (paste full code snippet including the iframe tags):";
            titleInput.placeholder = "e.g., AI changing use in society";
            sourceInput.value = "UC";
            sourceInput.placeholder = "e.g., UC";
            yearInput.value = "2027";
            yearInput.placeholder = "e.g., 2027";
            embedInput.placeholder = '<p><iframe class="lti-embed" src="..."></iframe></p>';
        } else {
            label.textContent = "YouTube URL (paste a standard watch link or share link):";
            titleInput.placeholder = "e.g., Equality, equity and social justice";
            sourceInput.value = "";
            sourceInput.placeholder = "e.g., SIPDC Trainer";
            yearInput.value = "";
            yearInput.placeholder = "e.g., 2022";
            embedInput.placeholder = "https://www.youtube.com/watch?v=Uvoios7frIs";
        }
    }

    function generateCode() {
        const title = document.getElementById('videoTitle').value.trim();
        const source = document.getElementById('source').value.trim();
        const year = document.getElementById('year').value.trim();
        const inputString = document.getElementById('embedCode').value.trim();
        const outputDiv = document.getElementById('outputCode');
        const copyBtn = document.getElementById('copyButton');
        const mediaType = document.querySelector('input[name="mediaType"]:checked').value;

        // Reset states
        outputDiv.classList.remove('error-text');
        copyBtn.style.display = 'none';

        // 1. Validate General Inputs
        if (!title || !source || !year || !inputString) {
            outputDiv.textContent = 'Error: Please ensure all fields (Title, Source, Year, and the URL/Code) are filled out before generating.';
            outputDiv.classList.add('error-text');
            return;
        }

        // Layout Variables
        let finalSrc = "";
        let permalink = "";
        let responsiveHeight = "";
        let maxDesktopHeight = "";
        let iframeClass = "";
        let iframeTitle = "";
        let iframeAllow = "";
        let ariaLabel = "";

        // 2. Process Echo LTI Logic
        if (mediaType === 'echo') {
            const srcRegex = /src=["'](.*?)["']/i;
            const match = inputString.match(srcRegex);
            
            if (!match || match.length < 2) {
                outputDiv.textContent = 'Error: Could not extract a valid [src] attribute from the provided Echo iframe code.';
                outputDiv.classList.add('error-text');
                return;
            }
            finalSrc = match[1];

            // Specific Echo Public Link Rejection
            if (finalSrc.includes('public')) {
                outputDiv.textContent = 'Error: The code to be converted must originate from the Echo LTI embed tool in Canvas, not a public link.';
                outputDiv.classList.add('error-text');
                return;
            }

            permalink = finalSrc;
            responsiveHeight = "calc(56.25vw + 56px)";
            maxDesktopHeight = "452px";
            iframeClass = "lti-embed";
            iframeTitle = `Echo video: ${title}`;
            iframeAllow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
            ariaLabel = "Echo video player";

        // 3. Process YouTube URL Logic
        } else if (mediaType === 'youtube') {
            const ytIdRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = inputString.match(ytIdRegex);
            
            if (!match || !match[1]) {
                outputDiv.textContent = 'Error: Could not extract a valid 11-character YouTube video ID from the provided URL.';
                outputDiv.classList.add('error-text');
                return;
            }
            
            const videoId = match[1];
            finalSrc = `https://www.youtube.com/embed/${videoId}`;
            permalink = `https://www.youtube.com/watch?v=${videoId}`;
            
            responsiveHeight = "56.25vw";
            maxDesktopHeight = "396px";
            iframeClass = "video-embed";
            iframeTitle = `YouTube video: ${title}`;
            iframeAllow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
            ariaLabel = "YouTube video player";
        }

        // 4. Construct Final HTML block with data-api-retarget="false"
        const generatedHtml = 
`<div style="max-width: 704px; min-width: 320px; width: 100%; margin: 0 auto;">
    <div style="width: 100%; height: ${responsiveHeight}; max-height: ${maxDesktopHeight}; overflow: hidden; background: #000000; border-radius: 4px; border: 1px solid #cdcdcd;">
        <iframe 
            class="${iframeClass}" 
            style="width: 100%; height: 100%; border: none; display: block;" 
            title="${iframeTitle}" 
            src="${finalSrc}" 
            loading="lazy" 
            allowfullscreen="allowfullscreen" 
            allow="${iframeAllow}" 
            aria-label="${ariaLabel}">
        </iframe>
    </div>
</div>
<p style="text-align: center; margin-top: 12px;">Source: <a href="${permalink}" data-api-retarget="false" target="_blank" rel="noopener">${title}</a> (${source}, ${year})</p>`;

        // 5. Output rendering
        outputDiv.classList.remove('error-text');
        outputDiv.textContent = generatedHtml;
        copyBtn.style.display = 'block'; 
    }
    
    function copyCode() {
        const outputDiv = document.getElementById('outputCode');
        const code = outputDiv.textContent;
        const copyBtn = document.getElementById('copyButton');
        
        if (!code || outputDiv.classList.contains('error-text')) {
             alert('No valid code generated yet to copy.');
             return;
        }

        // 1. Try the modern Clipboard API first
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(code).then(() => {
                showSuccessMessage(copyBtn);
            }).catch(err => {
                // If SharePoint blocks the API, trigger the fallback
                fallbackCopy(code, copyBtn);
            });
        } else {
            // If the API isn't available at all, trigger the fallback
            fallbackCopy(code, copyBtn);
        }
    }

    // 2. The Fallback Function for SharePoint Iframes
    function fallbackCopy(text, btnElement) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        
        // Prevent scrolling to the bottom of the page when the element is appended
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showSuccessMessage(btnElement);
            } else {
                alert('SharePoint blocked the automatic copy. Please manually highlight and copy the code text.');
            }
        } catch (err) {
            alert('SharePoint blocked the automatic copy. Please manually highlight and copy the code text.');
        }

        document.body.removeChild(textArea);
    }

    // 3. Success UI Update
    function showSuccessMessage(btnElement) {
        btnElement.textContent = 'Copied Code Successfully!';
        setTimeout(() => {
            btnElement.textContent = 'Copy code to clipboard';
        }, 2000);
    }

    function resetGenerator() {
        document.getElementById('videoTitle').value = '';
        document.getElementById('embedCode').value = '';
        document.querySelectorAll('input[name="mediaType"]')[0].checked = true;
        
        toggleMediaType(); // Restores correct defaults based on active radio
        
        const outputDiv = document.getElementById('outputCode');
        outputDiv.textContent = '';
        outputDiv.classList.remove('error-text');
        document.getElementById('copyButton').style.display = 'none';
    }
</script>
